<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signify - Digital Menu Board</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        coffee: { 950: '#0f0a09', 900: '#1a1412', 800: '#2C221F', 100: '#F5F1ED' },
                        accent: { green: '#2F5233', gold: '#D4AF37', mint: '#94C9A9' }
                    },
                    animation: {
                        'float': 'float 5s ease-in-out infinite',
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-15px)' } },
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #000; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; color: #F5F1ED; }
        #app-container {
            width: 1920px; height: 1080px;
            background: linear-gradient(135deg, #1a1412 0%, #0f0a09 100%);
            position: relative;
            transform-origin: center;
            transform: scale(min(1, min(100vw / 1920, 100vh / 1080)));
        }
        .active-feature {
            background: rgba(47, 82, 51, 0.3);
            transform: scale(1.05);
            border-radius: 12px;
            padding-left: 15px;
        }
        .edit-input { background: #2C221F; border: 2px solid #D4AF37; color: white; border-radius: 8px; text-align: inherit; width: 100%; }
        .item-row { transition: all 0.4s ease; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div id="app-container" class="flex flex-col p-20">
        
        <header class="flex justify-between items-center mb-16">
            <div>
                <h1 class="text-9xl font-black font-display text-white uppercase leading-none tracking-tighter">Signify</h1>
                <p class="text-3xl font-light text-accent-gold tracking-[0.3em] mt-2">ESTABLISHED 2026</p>
            </div>
            <div class="text-right">
                <div id="clock" class="text-8xl font-black font-display text-white tabular-nums">00:00:00</div>
                <div id="date" class="text-3xl font-medium text-accent-mint uppercase tracking-widest">January 30, 2026</div>
            </div>
        </header>

        <div class="flex-1 grid grid-cols-12 gap-20 overflow-hidden">
            <div id="menu-grid" class="col-span-8 grid grid-cols-2 gap-x-16 gap-y-6 content-start">
            </div>

            <div class="col-span-4">
                <div class="animate-float h-full bg-accent-green rounded-[4rem] p-16 flex flex-col justify-center items-center text-center shadow-2xl">
                    <div id="promo-display" class="z-10">
                    </div>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 right-0 w-24 h-24 opacity-0 hover:opacity-20 cursor-pointer flex items-end justify-end p-4 transition-opacity z-50" onclick="handleAuth()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2-0 002-2v-6a2 2-0 00-2-2H6a2 2-0 00-2 2v6a2 2-0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>

        <div id="admin-bar" class="hidden fixed top-0 left-0 w-full bg-accent-gold text-black p-4 text-center font-black text-2xl z-50">
            SYSTEM UNLOCKED — EDIT MODE ACTIVE
        </div>

        <div id="save-area" class="hidden fixed bottom-12 left-1/2 -translate-x-1/2 z-50">
            <button onclick="saveData()" class="bg-white text-black px-12 py-4 rounded-full text-3xl font-black shadow-2xl hover:bg-accent-gold transition-colors">
                SAVE CHANGES
            </button>
        </div>
    </div>

    <script>
        let menuData = JSON.parse(localStorage.getItem('coffeeBoardData')) || {
            categories: [
                { name: "Hot Coffee", items: [{n: "Vanilla Latte", p: "4.50"}, {n: "Americano", p: "3.25"}, {n: "Cappuccino", p: "4.00"}] },
                { name: "Cold Brew", items: [{n: "Nitro Cold", p: "5.50"}, {n: "Iced Caramel", p: "4.75"}, {n: "Cold Brew", p: "4.25"}] },
                { name: "Tea & More", items: [{n: "Chai Latte", p: "4.50"}, {n: "Matcha Tea", p: "5.00"}, {n: "Hot Cocoa", p: "3.50"}] }
            ],
            promo: { title: "STUDENT SPECIAL", desc: "Show ID for 20% Off All Pastries", footer: "DAILY DEAL" }
        };

        let isAdmin = false;

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        }

        function render() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = menuData.categories.map((cat, cIdx) => `
                <div>
                    ${isAdmin ? `<input class="edit-input text-2xl font-bold mb-2" value="${cat.name}" oninput="menuData.categories[${cIdx}].name=this.value">` : `<h2 class="text-3xl font-bold text-accent-gold mb-4 uppercase tracking-tighter">${cat.name}</h2>`}
                    <div class="space-y-2">
                        ${cat.items.map((item, iIdx) => `
                            <div class="item-row flex justify-between items-center" id="item-${cIdx}-${iIdx}">
                                ${isAdmin ? `<input class="edit-input mr-4" value="${item.n}" oninput="menuData.categories[${cIdx}].items[${iIdx}].n=this.value">` : `<span class="text-3xl font-semibold">${item.n}</span>`}
                                ${isAdmin ? `<input class="edit-input w-24 text-right" value="${item.p}" oninput="menuData.categories[${cIdx}].items[${iIdx}].p=this.value">` : `<span class="text-3xl font-bold text-accent-gold tabular-nums">£${item.p}</span>`}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            const promo = document.getElementById('promo-display');
            promo.innerHTML = `
                ${isAdmin ? `<input class="edit-input text-center text-2xl mb-4" value="${menuData.promo.title}" oninput="menuData.promo.title=this.value">` : `<h3 class="text-4xl font-bold mb-6">${menuData.promo.title}</h3>`}
                ${isAdmin ? `<textarea class="edit-input text-center h-32 mb-4" oninput="menuData.promo.desc=this.value">${menuData.promo.desc}</textarea>` : `<p class="text-6xl font-black mb-10 leading-tight">${menuData.promo.desc}</p>`}
                ${isAdmin ? `<input class="edit-input text-center text-2xl" value="${menuData.promo.footer}" oninput="menuData.promo.footer=this.value">` : `<div class="text-4xl font-bold border-t-2 border-white/20 pt-8">${menuData.promo.footer}</div>`}
            `;

            document.getElementById('admin-bar').classList.toggle('hidden', !isAdmin);
            document.getElementById('save-area').classList.toggle('hidden', !isAdmin);
        }

        function autoHighlight() {
            if (isAdmin) return;
            document.querySelectorAll('.item-row').forEach(el => el.classList.remove('active-feature'));
            const rCat = Math.floor(Math.random() * menuData.categories.length);
            const rItem = Math.floor(Math.random() * menuData.categories[rCat].items.length);
            const target = document.getElementById(`item-${rCat}-${rItem}`);
            if(target) target.classList.add('active-feature');
        }

        function handleAuth() {
            if(isAdmin) { isAdmin = false; render(); return; }
            if (prompt("Staff Access PIN Required:") === "1234") {
                isAdmin = true;
                render();
            }
        }

        function saveData() {
            localStorage.setItem('coffeeBoardData', JSON.stringify(menuData));
            isAdmin = false;
            render();
        }

        setInterval(updateClock, 1000);
        setInterval(autoHighlight, 10000);
        updateClock();
        render();
        autoHighlight();
    </script>
</body>
</html>
